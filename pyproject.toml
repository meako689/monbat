[project]
name = "monbat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = ["bleak>=0.22"]

[project.scripts]
monbat = "monbat:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: live-hardware tests requiring a Bluetooth adapter and real batteries",
]
